name: Update calendar

on:
  schedule:
    - cron: "15 0 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - cards.json
      - generate_calendar.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate calendar and status list
        run: python generate_calendar.py
      - name: Commit generated files when changed
        run: |
          if git diff --quiet -- calendar.ics README.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics README.md
          git commit -m "Update calendar status"
          git push
