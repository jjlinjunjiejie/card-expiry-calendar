<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>银行卡到期提醒</title>
  <style>
    :root { font: 17px/1.55 system-ui, -apple-system, sans-serif; color-scheme: light dark; }
    body { max-width: 680px; margin: 0 auto; padding: 56px 24px; }
    h1 { font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; letter-spacing: -.04em; }
    .button { display: inline-block; margin: 18px 0 28px; padding: 13px 20px; border-radius: 12px; background: #0a84ff; color: white; text-decoration: none; font-weight: 650; }
    .muted { opacity: .68; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>银行卡到期提醒</h1>
  <p>共 23 张卡。每张卡会在到期月份前两个月的 3 日显示为全天事项。</p>
  <a class="button" id="subscribe" href="calendar.ics">订阅到 Apple 日历</a>
  <p class="muted">标题只显示卡名，备注中保存卡名及到期时间。有效期结束满一个月且信息仍未更新时，该卡会自动从订阅日历移除；GitHub 清单仍会保留并添加删除线。</p>
  <p>订阅地址：<br><code id="url"></code></p>
  <script>
    const httpsUrl = new URL('calendar.ics', location.href).href;
    const webcalUrl = httpsUrl.replace(/^https?:/, 'webcal:');
    document.querySelector('#subscribe').href = webcalUrl;
    document.querySelector('#url').textContent = httpsUrl;
  </script>
</body>
</html>
